<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Presensi Wajah - BimtolProject</title>
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="absensi-container">
    <!-- Header -->
    <header class="absensi-header">
      <div class="header-title">
        <i class="fa-solid fa-camera-viewfinder text-rose"></i>
        <h2>Presensi Digital Wajah</h2>
      </div>
      <p class="header-desc">Verifikasi kehadiran</p>
    </header>

    <!-- Main Card -->
    <div class="absensi-card">
      <!-- Camera Preview Box -->
      <div class="camera-wrapper">
        <video id="videoElement" autoplay playsinline muted></video>
        <canvas id="photoCanvas" style="display: none;"></canvas>
        <div class="scan-overlay">
          <div class="face-frame">
            <span class="corner top-left"></span>
            <span class="corner top-right"></span>
            <span class="corner bottom-left"></span>
            <span class="corner bottom-right"></span>
          </div>
          <div class="scan-line"></div>
        </div>
        <div id="cameraPlaceholder" class="camera-placeholder">
          <i class="fa-solid fa-video-slash"></i>
          <p>Kamera belum aktif. Klik tombol "Mulai Kamera" di bawah.</p>
        </div>
      </div>

      <!-- User Form -->
      <form id="attendanceForm" class="attendance-form" onsubmit="submitAttendance(event)">
        <div class="form-group">
          <label for="userName"><i class="fa-solid fa-user"></i> Nama Lengkap dan Kelas</label>
          <input type="text" id="userName" placeholder="cth: Xelia Fux (X TSM 1)" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="userActivity"><i class="fa-solid fa-clock"></i> Status Kehadiran</label>
          <select id="userActivity" required>
            <option value="Hadir Tepat Waktu">Hadir</option>
            <option value="Hadir Bertugas / Piket">Terlambat</option>
            <option value="Izin / Dispensasi">Izin / Dispensasi</option>
          </select>
        </div>

        <!-- Realtime Clock Display -->
        <div class="live-clock-card">
          <div class="clock-item">
            <span class="clock-label">WAKTU REAL-TIME</span>
            <span id="liveTime" class="clock-value">--:--:-- WIB</span>
          </div>
          <div class="clock-item">
            <span class="clock-label">TANGGAL</span>
            <span id="liveDate" class="clock-value">-- / -- / ----</span>
          </div>
        </div>

        <!-- Action Controls -->
        <div class="button-group">
          <button type="button" id="btnStartCamera" class="btn btn-secondary" onclick="startCamera()">
            <i class="fa-solid fa-camera"></i> Mulai Kamera
          </button>
          <button type="submit" id="btnSubmit" class="btn btn-primary" disabled>
            <i class="fa-solid fa-paper-plane"></i> Kirim Presensi
          </button>
        </div>
      </form>

      <!-- Feedback Status Alert -->
      <div id="statusAlert" class="status-alert hidden">
        <i id="statusIcon" class="fa-solid fa-spinner fa-spin"></i>
        <span id="statusMessage">Memproses data...</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
